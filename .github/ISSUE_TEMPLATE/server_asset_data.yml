name: Server asset data
description: Share FModel exports of server-only assets, so Core can match a build without anyone installing them
title: "Server asset data: <build> <asset>"
labels: ["server assets"]
body:
  - type: markdown
    attributes:
      value: |
        PC builds from 1.10 on are missing some assets that only the server uses, such as the Save the World AI director.
        Core has a stand-in for each one. With the real data from a build's server assets, Core can make that stand-in match Epic's exactly.

        **Please don't upload pak, utoc, ucas or uasset files here.** Upload FModel's JSON export instead: right-click the asset in FModel and choose **Save Properties (.json)**.

        **Made a pak of a build's server assets?** Contribute it to [Core-ServerAssets](https://github.com/PongooDev/Core-ServerAssets) with its [Server assets pak form](https://github.com/PongooDev/Core-ServerAssets/issues/new?template=server_assets_pak.yml). Its README lists the assets to include. Core-Launcher installs those paks for server hosts. JSON exports are still welcome here: the data helps Core's stand-ins match Epic's for everyone without the pak.
  - type: input
    id: build
    attributes:
      label: Fortnite build and changelist
      description: The exact version. It has to match the PC build Core supports.
      placeholder: "2.2 (CL-3841827)"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where the server assets came from
      options:
        - PlayStation build
        - Xbox build
        - Other (say which below)
    validations:
      required: true
  - type: checkboxes
    id: assets
    attributes:
      label: Assets included
      description: Any server-only asset is welcome, the more the better. These are the ones Core already knows it needs.
      options:
        - label: "/Game/AIDirector/AIDirector_Fortnite (AIDirector_Fortnite and its Default__AIDirector_Fortnite_C)"
        - label: "3.0 (CL-3901517): /Game/Athena/Maps/Athena_LocationVolumes and /Game/Athena/Maps/Streaming/Athena_GameplayActors, with each FortPoiVolume's BrushComponent (its transform and BrushBodySetup)"
        - label: "2.5 and later: the server loot tier data's BluGloDifficultyTG rows (the PC paks only ship LootTierData_Client)"
        - label: Other server-only assets (list them below, or just say "everything" if you exported the lot)
  - type: textarea
    id: files
    attributes:
      label: JSON exports
      description: Drag the .json files in. For lots of assets, zip the exported folder (keep its folder structure) and drag the zip in.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Checks
      options:
        - label: The exports are from the same build and changelist as above.
          required: true
        - label: I attached JSON exports only, not game files.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
