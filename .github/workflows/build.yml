name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # windows-2022 has Visual Studio 2022 (the v143 toolset the projects and local builds use); windows-latest moved to
    # Visual Studio 18, whose compiler differs from the owner's builds and whose PCH broke a mixed build (C1853).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: microsoft/setup-msbuild@v2

      # cl.exe adds the CL environment variable to every compile: Core.dll logs the release's build number and commit as
      # it starts (Server/Boot.cpp), so a reporter's Server_log names the build it came from.
      - name: Build
        shell: pwsh
        run: |
          $env:CL = "/DCORE_BUILD_NUMBER=${{ github.run_number }} /DCORE_COMMIT=0x$('${{ github.sha }}'.Substring(0, 7))"
          msbuild Core.sln /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64

      - name: Publish release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub's API sometimes refuses the release with "HTTP 403: Resource not accessible by integration" although the
        # same token publishes the runs before and after it (build-777, build-780), so the publish is retried; a release
        # an attempt half-made gets its files uploaded instead of being created again.
        run: |
          TAG="build-${{ github.run_number }}"
          FILES="x64/Release/Core.dll x64/Release/CoreClient.dll x64/Release/CoreRedirect.dll"
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" $FILES --clobber && gh release edit "$TAG" --latest && exit 0
            else
              gh release create "$TAG" $FILES \
                --target "${{ github.sha }}" \
                --title "Build ${{ github.run_number }}" \
                --notes "$(git log -1 --format='%s (%h)')" \
                --latest && exit 0
            fi
            echo "Publish attempt $attempt failed; retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
          done
          exit 1
